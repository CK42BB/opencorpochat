name: Bug report
description: Something isn't working as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! **Security issues must be reported privately** — see SECURITY.md.
        Please remove any secrets or personal data from logs and screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenCorpoChat version
      description: Shown in the About dialog, or run `ocpc --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker (single container)
        - Docker Compose (minimal)
        - Docker Compose (full)
        - Bare metal / systemd
        - Development (pnpm dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (default)
        - PostgreSQL
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS (for client issues)
      placeholder: Firefox 131 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Server logs (`docker logs ocpc`) or browser console. Remove secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
