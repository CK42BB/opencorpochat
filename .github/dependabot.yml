version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose releases at least a few days old. This avoids freshly published
    # (possibly compromised or yanked) packages and matches pnpm's minimumReleaseAge
    # safeguard, which otherwise rejects very new transitive dependencies.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*', '@smithy/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Stay on a Node.js LTS line; move to the next LTS deliberately, not via bot.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
