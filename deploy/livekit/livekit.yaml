# Example LiveKit SFU configuration for large OpenCorpoChat meetings.
# API keys are passed via the LIVEKIT_KEYS environment variable (see docker-compose.full.yml)
# and must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET given to OpenCorpoChat.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Discover the public IP automatically (set node_ip instead if this fails).
  use_external_ip: true
room:
  empty_timeout: 300
  max_participants: 100
