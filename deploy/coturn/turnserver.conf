# SPDX-License-Identifier: AGPL-3.0-only
# Example coturn configuration for OpenCorpoChat calls.
# OpenCorpoChat mints short-lived TURN credentials using the TURN REST API scheme,
# so coturn must share the same secret (TURN_SECRET in OpenCorpoChat).

listening-port=3478
tls-listening-port=5349

# Relay port range — open these UDP ports in your firewall.
min-port=49160
max-port=49200

# Time-limited credentials via shared secret.
use-auth-secret
# Set here or pass --static-auth-secret on the command line (as docker-compose.full.yml does).
# static-auth-secret=CHANGE_ME
realm=chat.example.com

# If the server is behind NAT (e.g. cloud VM), set its public IP:
# external-ip=203.0.113.10

# TLS (for turns: on 5349). Point at your certificate files.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Never relay to private/internal networks (prevents abuse as a proxy into your LAN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

total-quota=100
stale-nonce=600
log-file=stdout
simple-log
